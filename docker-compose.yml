# Geliştirme altyapısı — yalnızca veri katmanı.
#
# Uygulama servisleri (web/api/worker) burada YOK: onların imajları Faz 1.9'da
# çok mimarili build ile geliyor. Bu dosya `pnpm dev` ile yerelde çalışan
# uygulamanın ihtiyaç duyduğu Postgres ve Redis'i ayağa kaldırır.
#
# ARM64 (K14): üç imajın da `linux/arm64/v8` manifesti `docker manifest inspect`
# ile doğrulandı (Faz 1.7). Üretim Oracle Ampere A1 üzerinde çalışacak.
#
# Sürüm politikası: MAJÖR sabitlenir, yama akar. PostgreSQL ve Redis majör
# içinde kırıcı değişiklik yapmaz; güvenlik yamalarının otomatik gelmesi
# istenir. Majör değişiklikleri docs/DEPENDENCY-WATCH.md'de izlenir.

name: fms

services:
  postgres:
    # 16 → 18 (Faz 3.0). Şema bu fazda yazılıyor; majör değişimi bugün bedava,
    # veri girdikten sonra pg_upgrade/dump-restore ister. 16 EOL Kas 2028,
    # 18 EOL Kas 2030. ARM64 manifesti doğrulandı: `docker manifest inspect
    # postgres:18` → linux/arm64/v8 mevcut (K14). Ölçülen sürüm: 18.6.
    image: postgres:18
    container_name: fms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlı değil — .env.example dosyasını .env olarak kopyalayın}
      POSTGRES_DB: ${POSTGRES_DB:-fms}
      # ⚠️ `--locale=C` DEĞİL — ölçümle elendi (Faz 3.0).
      #
      # `C` ctype Unicode büyük-küçük harf katlaması YAPMIYOR ve bu Türkçe
      # metinde aramayı SESSİZCE bozuyordu. Ölçüldü (postgres:18, --locale=C):
      #     'BEŞİKTAŞ' ILIKE '%beşiktaş%'  →  f   ❌
      #     lower('BEŞİKTAŞ')              →  beŞİktaŞ   ❌
      # ASCII adlarda sorun görünmüyordu; hata yalnızca Türkçe harflerde çıkıyor,
      # yani "çalışıyor gibi" bir kapı. Faz 32 (50.000 oyuncu üzerinde transfer
      # araması) ve her kulüp/oyuncu adı araması bunun üstünde çalışacak.
      #
      # `builtin` sağlayıcı + `C.UTF-8` seçildi. Aynı ölçüm bu ayarla:
      #     'BEŞİKTAŞ' ILIKE '%beşiktaş%'  →  t   ✅
      #     lower('BEŞİKTAŞ')              →  beşiktaş   ✅
      #     lower('I') = 'i', upper('i') = 'I'          ✅
      #
      # Son satır bilinçli: veritabanı VARSAYILANI Türkçe DEĞİL. `tr-TR` seçilseydi
      # `lower('I')` → `ı` olurdu (ölçüldü) ve bu kural İngilizce kulüp/oyuncu
      # adlarına da uygulanırdı — "Inter" araması bozulurdu.
      #
      # Sıralama bir SUNUM kaygısıdır ve sorgu başına çözülür:
      #     ORDER BY name COLLATE "tr-TR-x-icu"   (v1 Türkçe arayüz)
      #     ORDER BY name COLLATE "en-US-x-icu"   (v2 İngilizce arayüz)
      # Veritabanı `C` locale'inde olsa bile 871 ICU collation kullanılabilir
      # durumda (ölçüldü) ve COLLATE'li bir indeks ORDER BY ... LIMIT için
      # Index Only Scan veriyor (EXPLAIN ile doğrulandı) — yani tek veritabanı
      # iki dilli arayüzü karşılıyor.
      #
      # ⚠️ `builtin` sağlayıcı PostgreSQL 17+ gerektiriyor: PG16'da
      # `initdb: error: unrecognized locale provider: builtin` (ölçüldü).
      # PG16 aynı işlevi libc `C.UTF-8` ile de yapabilirdi, ama orada
      # `datcollversion` BOŞ geliyor — glibc yükseltmesi indeksleri uyarı
      # vermeden geçersizleştirebilir. `builtin`de `datcollversion=1` ve
      # Postgres'in kendi içinde uygulandığı için işletim sistemi
      # yükseltmelerinden etkilenmiyor.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Named volume — bind mount DEĞİL. Windows'ta bind mount hem izin
      # sorunları çıkarır hem de WSL2 ile Windows dosya sistemi arasındaki
      # köprü yüzünden belirgin yavaştır (docs/ADR/0004).
      #
      # ⚠️ BAĞLAMA NOKTASI 18'DE DEĞİŞTİ: `/var/lib/postgresql/data` DEĞİL,
      # `/var/lib/postgresql`. 18+ imajları veriyi majör sürüme özgü bir alt
      # dizine koyuyor (ölçüldü: `SHOW data_directory` → /var/lib/postgresql/18/docker).
      # Eski yol verilirse konteyner açılmıyor, exit 1 ve açık bir hata basıyor.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # `pg_isready` DEĞİL, bilinçli. Ölçüldü (Faz 1.7): pg_isready yalnızca
      # "sunucu bağlantı kabul ediyor mu" sorusuna bakar; var olmayan bir
      # veritabanına da var olmayan bir kullanıcıya da exit 0 döner. Yani
      # veritabanı hiç oluşmamışken bile "healthy" der — beyan edilen ama
      # çalışmayan bir kapı. `psql -c 'SELECT 1'` sunucuyu, kimlik doğrulamayı
      # ve veritabanının varlığını birlikte doğrular.
      test:
        [
          'CMD-SHELL',
          'psql -U ${POSTGRES_USER:-fms} -d ${POSTGRES_DB:-fms} -c "SELECT 1" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: fms-redis
    restart: unless-stopped
    # appendonly: tur kuyruğu (BullMQ) yeniden başlatmada iş kaybetmesin.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  adminer:
    image: adminer:6
    container_name: fms-adminer
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
