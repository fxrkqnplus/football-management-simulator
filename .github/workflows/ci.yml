name: CI

# Kalite kapıları + çok mimarili imaj derlemesi.
# Dağıtım workflow'u BURADA DEĞİL — gerçek dağıtım Faz 50'de.

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Faz 1.8'den devreden: CI'da `.env` yok ve `apps/web` derlemesi
  # PUBLIC_BASE_PATH olmadan bilerek durur. Değer `.env.example`'dan
  # KOPYALANMIYOR — kopyalamak CI'ı örnek dosyanın güncelliğine bağımlı kılar.
  # Ortam değişkeni açık, izlenebilir ve workflow diff'inde görünür.
  PUBLIC_BASE_PATH: /fms

jobs:
  quality:
    name: Kalite kapıları (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            # Public repolarda ücretsiz native ARM runner. QEMU emülasyonu
            # KULLANILMIYOR: üretim ARM64 (Oracle Ampere A1) ve native koşu
            # hem gerçekçi hem 5-10 kat hızlı (K14).
            runner: ubuntu-24.04-arm

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur (.nvmrc tek kaynak)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Node kapısı kurulumdan ÖNCE. Yerel `preinstall` kapısı ikinci savunma
      # hattı: pnpm onu paketler linklendikten SONRA çalıştırıyor (Faz 1.1'de
      # ölçüldü), yani indirmeyi engellemiyor. CI'da sıra bizde.
      - name: Node sürüm kapısı (install ÖNCESİ)
        run: node scripts/check-node-version.mjs

      - name: pnpm etkinleştir
        run: corepack enable

      - name: pnpm store yolunu bul
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm store önbelleği
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ matrix.arch }}-

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Tip denetimi
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Biçim denetimi
        run: pnpm format:check

      - name: Testler ve kapsam eşikleri
        run: pnpm test:coverage

      - name: Derleme
        run: pnpm build

      # ADR-0004 §2 üçüncü savunma hattı: bu adım Linux'ta koşuyor ve dosya
      # sistemi büyük/küçük harfe DUYARLI. Windows'ta görünmeyen import harf
      # hataları burada ortaya çıkar.
      - name: Mimari denetimi
        run: pnpm arch:check

  image:
    name: İmaj (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: API imajını derle
        run: docker buildx build --load -f apps/api/Dockerfile -t fms-api:ci .

      - name: Web imajını derle
        run: |
          docker buildx build --load \
            --build-arg PUBLIC_BASE_PATH="$PUBLIC_BASE_PATH" \
            -f apps/web/Dockerfile -t fms-web:ci .

      # "İmaj derlendi" hiçbir şey kanıtlamaz — kabul kriteri "ikisi de
      # çalışıyor" diyor. Konteynerleri gerçekten koşturup HTTP cevabı alıyoruz.
      - name: API imajı çalışıyor mu
        run: |
          docker run -d --name api-smoke -p 3001:3001 \
            -e PUBLIC_BASE_PATH="$PUBLIC_BASE_PATH" \
            -e DATABASE_URL=postgresql://fms:x@db:5432/fms \
            -e REDIS_URL=redis://redis:6379 \
            -e JWT_SECRET=ci-duman-testi-icin-32-karakterden-uzun-anahtar \
            fms-api:ci
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:3001${PUBLIC_BASE_PATH}/api/health" > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/health)" = "404"
          docker rm -f api-smoke

      - name: Eksik ortam değişkeniyle API AÇILMAMALI
        run: |
          if docker run --rm -e PUBLIC_BASE_PATH="$PUBLIC_BASE_PATH" fms-api:ci > /tmp/noenv.log 2>&1; then
            echo "HATA: eksik ortam değişkeniyle açıldı"
            exit 1
          fi
          grep -q 'DATABASE_URL' /tmp/noenv.log
          grep -q 'tanımlı değil' /tmp/noenv.log

      - name: Web imajı çalışıyor mu
        run: |
          docker run -d --name web-smoke -p 3000:3000 \
            -e PUBLIC_BASE_PATH="$PUBLIC_BASE_PATH" fms-web:ci
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:3000${PUBLIC_BASE_PATH}/" > /tmp/index.html; then break; fi
            sleep 1
          done
          ASSET=$(grep -oE 'src="[^"]*"' /tmp/index.html | head -1 | sed 's/src="//;s/"//')
          echo "varlık: $ASSET"
          case "$ASSET" in
            "${PUBLIC_BASE_PATH}"/*) ;;
            *) echo "HATA: varlık yolu ${PUBLIC_BASE_PATH} ile başlamıyor"; exit 1 ;;
          esac
          curl -fsS -o /dev/null "http://localhost:3000${ASSET}"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "404"
          docker rm -f web-smoke

      - name: Mimari doğrulaması
        run: |
          ARCH=$(docker run --rm --entrypoint uname fms-api:ci -m)
          echo "imaj mimarisi: $ARCH"
          case "${{ matrix.arch }}" in
            amd64) test "$ARCH" = "x86_64" ;;
            arm64) test "$ARCH" = "aarch64" ;;
          esac
